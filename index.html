<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aset BMN">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Verifikasi Aset BMN</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">
                <svg viewBox="0 0 100 100" width="80" height="80">
                    <rect width="100" height="100" rx="20" fill="#2563eb"/>
                    <text x="50" y="38" font-size="14" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-weight="bold">VERIF</text>
                    <text x="50" y="55" font-size="14" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-weight="bold">aset</text>
                    <line x1="25" y1="63" x2="75" y2="63" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                    <text x="50" y="80" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial,sans-serif">BMN</text>
                </svg>
            </div>
            <h1 class="splash-title">Verifikasi Aset BMN</h1>
            <p class="splash-sub">Kementerian Agama RI</p>
            <div class="splash-loader">
                <div class="splash-spinner"></div>
            </div>
        </div>
    </div>

    <!-- App Container (router injects pages here) -->
    <div id="app"></div>

    <!-- Install Banner -->
    <div id="installBanner" class="install-banner hidden">
        <div class="install-banner-content">
            <i class="fas fa-mobile-alt"></i>
            <div class="install-banner-text">
                <strong>Instal Aplikasi</strong>
                <span id="installHint">Tambahkan ke layar utama untuk akses cepat</span>
            </div>
            <button class="btn btn-primary btn-sm" id="btnInstall" onclick="installApp()">
                <i class="fas fa-plus"></i> Instal
            </button>
            <button class="btn-icon btn-close-install" onclick="dismissInstall()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h2 id="modalTitle">Konfirmasi</h2>
            <p id="modalMessage">Apakah kamu yakin?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
                <button class="btn btn-danger" id="modalConfirm">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon success">
                <i class="fas fa-check"></i>
            </div>
            <h2>Berhasil!</h2>
            <p id="successMessage">Data berhasil disimpan</p>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeSuccessModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- App modules (load order matters) -->
    <script src="js/shared.js"></script>
    <script src="app.js"></script>
    <script src="js/firebase-sync.js"></script>
    <script src="js/asset.js"></script>
    <script src="js/verification.js"></script>
    <script src="js/photo.js"></script>
    <script src="js/import-export.js"></script>
</body>
</html>
