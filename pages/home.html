<div id="page-home" class="page active">
    <!-- Quick Stats -->
    <div class="quick-stats">
        <div class="quick-stat">
            <span class="stat-num" id="statTotal">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="quick-stat verified">
            <span class="stat-num" id="statVerified">0</span>
            <span class="stat-label">Terverifikasi</span>
        </div>
        <div class="quick-stat unverified">
            <span class="stat-num" id="statUnverified">0</span>
            <span class="stat-label">Belum</span>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-header">
            <span>Progress Verifikasi</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>

    <!-- Dashboard Stats Cards -->
    <div class="dashboard-stats">
        <div class="dash-stat-card blue">
            <i class="fas fa-boxes-stacked"></i>
            <div>
                <span class="dash-num" id="dashTotal">0</span>
                <span class="dash-label">Total Aset</span>
            </div>
        </div>
        <div class="dash-stat-card green">
            <i class="fas fa-check-circle"></i>
            <div>
                <span class="dash-num" id="dashVerified">0</span>
                <span class="dash-label">Terverifikasi</span>
            </div>
        </div>
        <div class="dash-stat-card orange">
            <i class="fas fa-clock"></i>
            <div>
                <span class="dash-num" id="dashUnverified">0</span>
                <span class="dash-label">Belum Diverifikasi</span>
            </div>
        </div>
        <div class="dash-stat-card red">
            <i class="fas fa-exclamation-triangle"></i>
            <div>
                <span class="dash-num" id="dashProblem">0</span>
                <span class="dash-label">Rusak/Bermasalah</span>
            </div>
        </div>
    </div>

    <!-- Kondisi Stats -->
    <div class="dash-section">
        <h3><i class="fas fa-heartbeat"></i> Berdasarkan Kondisi</h3>
        <div id="kondisiStats" class="kondisi-stats"></div>
    </div>

    <!-- Aset Belum Diverifikasi -->
    <div class="recent-section">
        <h3><i class="fas fa-exclamation-triangle"></i> Belum Diverifikasi <span id="unverifiedCount" class="unverified-badge"></span></h3>
        <div id="unverifiedList" class="recent-list">
            <div class="empty-state-small">
                <i class="fas fa-check-circle"></i>
                <p>Semua aset sudah terverifikasi!</p>
            </div>
        </div>
        <button id="btnLoadMore" class="btn btn-outline-dark btn-full hidden" onclick="loadMoreUnverified()">
            <i class="fas fa-arrow-down"></i> Tampilkan Lebih Banyak
        </button>
    </div>

    <!-- Recent Verifications -->
    <div class="recent-section">
        <h3><i class="fas fa-clock"></i> Verifikasi Terakhir</h3>
        <div id="recentList" class="recent-list">
            <div class="empty-state-small">
                <i class="fas fa-inbox"></i>
                <p>Belum ada verifikasi</p>
            </div>
        </div>
    </div>

    <!-- Export -->
    <div class="dash-section">
        <h3><i class="fas fa-download"></i> Export Data</h3>
        <button class="btn btn-success btn-full" onclick="exportExcel()">
            <i class="fas fa-file-excel"></i> Export ke Excel (Semua Data)
        </button>
        <button class="btn btn-primary btn-full" onclick="exportPDF()" style="margin-top: 8px;">
            <i class="fas fa-file-pdf"></i> Export ke PDF (dengan Foto)
        </button>
    </div>
</div>
