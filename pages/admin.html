<section id="screen-admin" class="screen">
    <div class="detail-header">
        <button class="btn-icon" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h2>Admin</h2>
    </div>
    <div class="admin-section">
        <div class="admin-card">
            <h3><i class="fas fa-database"></i> Data Management</h3>
            <button class="btn btn-danger btn-full" onclick="confirmClearData()">
                <i class="fas fa-trash"></i> Hapus Semua Data
            </button>
            <button class="btn btn-info btn-full" onclick="exportFullBackup()">
                <i class="fas fa-download"></i> Backup JSON
            </button>
            <button class="btn btn-success btn-full" onclick="document.getElementById('restoreInput').click()">
                <i class="fas fa-upload"></i> Restore JSON
            </button>
            <input type="file" id="restoreInput" accept=".json" class="hidden" onchange="restoreBackup(event)">
        </div>

        <div class="admin-card">
            <h3><i class="fas fa-info-circle"></i> Tentang</h3>
            <p class="text-muted">Verifikasi Aset BMN v1.0</p>
            <p class="text-muted">Kementerian Agama RI</p>
        </div>
    </div>
</section>
